# What can be checked without the VS Code checkout. The extensions' own type checks (`npm run typecheck`, and flow-agent's
# `tsc --noEmit`) extend editor/vscode's tsconfig and typings, so they need `npm run setup` (a 10-20 minute job) and stay a
# local check. The `extensions-typecheck` job covers flow-view and flow-harness instead, against @types/vscode. flow-agent
# (proposed chat and language model APIs) and flow-import (the proposed extensionsAny API) use typings only the checkout has,
# so they are not type-checked here: their tests and bundles are. The tests run on Linux, Windows and macOS.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json
            editor/extensions/*/package-lock.json

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.x

      - name: Scripts parse
        run: for f in scripts/*.mjs; do node --check "$f"; done

      - name: Update service (version check, update files)
        run: npm run test:update

      # The desktop e2e harness itself (no windows: the scenarios run in Docker or Windows Sandbox, never here).
      - name: Desktop e2e harness
        run: npm run test:e2e-unit

      - name: Analyzer
        run: dotnet build analyzer -nologo -v q

      # Unit tests on in-memory solutions; the analyzer's end-to-end tests are flow-view's C# tests below, which need the build above.
      - name: Analyzer tests
        run: dotnet test analyzer/tests -nologo -v q

      - name: Canvas
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: flow-view (build and tests)
        working-directory: editor/extensions/flow-view
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: flow-agent (build and tests)
        working-directory: editor/extensions/flow-agent
        run: |
          npm ci --no-audit --no-fund
          node esbuild.mjs
          npm test

      - name: flow-harness (build and tests)
        working-directory: editor/extensions/flow-harness
        run: |
          npm ci --no-audit --no-fund
          node esbuild.mjs
          npm test

      - name: flow-import (build and tests)
        working-directory: editor/extensions/flow-import
        run: |
          npm ci --no-audit --no-fund
          node esbuild.mjs
          npm test

      # Last, so every package's node_modules exist and the devDependency rule can resolve imports; it still runs when
      # an earlier step failed, so a broken test does not hide an architecture violation.
      - name: Architecture rules (dependency-cruiser, wire types, command contracts)
        if: ${{ !cancelled() }}
        run: |
          npm ci --no-audit --no-fund
          npm run arch

  # flow-view and flow-harness against @types/vscode instead of the generated VS Code checkout (cloning that is the 10-20 minute
  # `npm run setup`). The options are the checkout's tsconfig.base.json (.github/tsconfig.extensions.json). 1.140.0 is the newest
  # @types/vscode at or below the checkout's 1.141.0 (there is no 1.141.0 package); a flow-view or flow-harness use of a newer API shows up here as an error
  # to fix or to leave to the local check. Installed with --no-save in this job only: no package.json or lockfile carries it, and `npm run arch` (the build job)
  # still sees `vscode` unresolved, which its dependency rules rely on (test/arch/vscode-unresolved.test.mjs).
  extensions-typecheck:
    name: extensions type check (flow-view, flow-harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/extensions/flow-view/package-lock.json
            editor/extensions/flow-harness/package-lock.json

      - name: Install
        run: |
          npm ci --no-audit --no-fund
          (cd editor/extensions/flow-view && npm ci --no-audit --no-fund)
          (cd editor/extensions/flow-harness && npm ci --no-audit --no-fund)
          npm install --no-save --no-audit --no-fund @types/vscode@1.140.0 @types/node@24.12.4

      - name: Type check
        run: npx tsc -p .github/tsconfig.extensions.json

  # The website (site/), built but not deployed: a change to the canvas, the protocol types or the index that breaks
  # it shows up on the pull request. The deploy to GitHub Pages is site.yml, on pushes to main.
  site:
    name: site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            editor/extensions/flow-view/package-lock.json
            editor/extensions/flow-harness/package-lock.json
            site/package-lock.json

      - name: Canvas and index worker
        run: |
          (cd ui && npm ci --no-audit --no-fund)
          (cd editor/extensions/flow-view && npm ci --no-audit --no-fund && node esbuild.mjs)
          (cd editor/extensions/flow-harness && npm ci --no-audit --no-fund)

      - name: Demo data from the real index
        run: node scripts/site-data.mjs

      - name: Site (type-check against protocol/, build, play the demo in Chrome)
        working-directory: site
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm run test:e2e

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x

      - name: Install semgrep
        run: pipx install semgrep==1.181.0

      - name: Insilode's rules pass their fixtures
        run: semgrep --test --metrics=off .semgrep/rules

      # Same rulesets and policy as `npm run semgrep` locally: ERROR findings fail, WARNING findings are listed.
      - name: Scan
        run: node scripts/semgrep.mjs
