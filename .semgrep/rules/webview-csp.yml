# Kept apart from insilode.yml: a `generic` rule is tested against its own fixture (webview-csp.txt).
rules:
  - id: insilode-webview-html-without-csp
    message: >-
      This webview page has no Content-Security-Policy. Every Insilode webview sets one starting from default-src 'none',
      so injected markup in the page cannot load anything from outside it.
    severity: ERROR
    languages: [generic]
    paths:
      include: ['/editor/extensions/*/src/**/*.ts', '/.semgrep/rules/webview-csp.*']
    # A page whose <head> closes with no CSP meta in it. The head may be built from several concatenated strings.
    pattern-regex: '(?i)<!doctype html>(?:(?!Content-Security-Policy)[\s\S])*?</head>'
    metadata:
      category: security
      cwe: 'CWE-79: Improper Neutralization of Input During Web Page Generation'

  - id: insilode-webview-script-src-unsafe
    message: >-
      This Content-Security-Policy lets inline script run for any markup injected into the page. Give the page a nonce made
      for each load (script-src 'nonce-...') and put it on the page's script tag, as home.ts and settingsPage.ts do.
    severity: ERROR
    languages: [generic]
    paths:
      include: ['/editor/extensions/*/src/**/*.ts', '/scripts/site-data.mjs', '/site/**/*.html', '/site/scripts/*.mjs', '/.semgrep/rules/webview-csp.txt']
    # Only the script-src directive: style-src may keep 'unsafe-inline'.
    pattern-regex: 'script-src[^;`"]*''unsafe-(?:inline|eval)'''
    metadata:
      category: security
      cwe: 'CWE-79: Improper Neutralization of Input During Web Page Generation'
